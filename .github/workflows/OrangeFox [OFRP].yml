name: OrangeFox [OFRP]

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://github.com/momo54181/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '9.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/mmbsmm-git/android_device_youxuepai_k71v1_64_bsp'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/youxuepai/k71v1_64_bsp'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
        default: ''
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
        default: ''
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'k71v1_64_bsp'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'omni_k71v1_64_bsp'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

env:
  # Pre-built Ubuntu 20.04 + Android 9 deps image, pushed to this repo's GHCR.
  # Built by the 'docker' step below on first run, reused afterwards.
  IMAGE: ghcr.io/${{ github.repository }}/orfrp-9-builder:latest

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write   # needed to push to GHCR
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    # Build & push the pre-built image once (cached via GHCR layers, so this is
    # fast on subsequent runs). If the image already exists it just pulls it.
    - name: Build and cache Ubuntu 20.04 build image
      run: |
        set -e
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        # Pull first if present, else build.
        docker pull "$IMAGE" >/dev/null 2>&1 || {
          echo "Image not cached, building..."
          docker build -t "$IMAGE" -f Dockerfile .
          docker push "$IMAGE"
        }
        echo "Using image: $IMAGE"

    # Everything (sync + clone + build) happens inside the pre-built 20.04 container.
    - name: Sync, clone and build inside pre-built Ubuntu 20.04 container
      run: |
        set -e
        WS="${{ steps.pwd.outputs.workspace-folder }}"
        docker run --rm \
          -v "$WS:/workspace" \
          -e SYNC_URL="${{ github.event.inputs.SYNC_URL }}" \
          -e MANIFEST_BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}" \
          -e DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE_URL }}" \
          -e DEVICE_TREE_BRANCH="${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          -e DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}" \
          -e COMMON_TREE_URL="${{ github.event.inputs.COMMON_TREE_URL }}" \
          -e COMMON_PATH="${{ github.event.inputs.COMMON_PATH }}" \
          -e DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}" \
          -e MAKEFILE_NAME="${{ github.event.inputs.MAKEFILE_NAME }}" \
          -e BUILD_TARGET="${{ github.event.inputs.BUILD_TARGET }}" \
          "$IMAGE" bash -e -c '
            echo "== Running in pre-built container: $(cat /etc/os-release | grep -E \"^VERSION_ID\") =="
            echo "== python2 + ncurses5 already present =="
            python2 --version
            ldconfig -p | grep -E "lib(tinfo|ncurses)5\\.so" | head

            # --- 1) Sync OrangeFox sources ---
            cd /workspace
            git clone "$SYNC_URL" sync
            cd sync
            chmod 777 orangefox_sync.sh
            ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "/workspace/fox_$MANIFEST_BRANCH"

            # --- 2) Clone device tree ---
            cd "/workspace/fox_$MANIFEST_BRANCH"
            git clone "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" "./$DEVICE_PATH"

            # --- 3) Clone common tree (optional) ---
            if [ -n "$COMMON_TREE_URL" ] && [ -n "$COMMON_PATH" ]; then
              git clone "$COMMON_TREE_URL" -b "$DEVICE_TREE_BRANCH" "./$COMMON_PATH"
            fi

            # --- 4) Build recovery ---
            cd "/workspace/fox_$MANIFEST_BRANCH"
            source build/envsetup.sh
            export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch "${MAKEFILE_NAME}-eng" && make clean && mka adbd "${BUILD_TARGET}image" -j$(nproc --all) || true
            echo "=== BUILD FINISHED ==="
            ls -la "/workspace/fox_$MANIFEST_BRANCH/out/target/product/$DEVICE_NAME/" 2>/dev/null || true
          '

    - name: Check the output directory before uploading
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
          TREE: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: OrangeFox [OFRP]

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: '同步源仓库地址 (OrangeFox sync)'
        required: true
        default: 'https://github.com/momo54181/sync.git'
      MANIFEST_BRANCH:
        description: '源码分支版本'
        required: true
        default: '9.0'
      DEVICE_TREE_URL:
        description: '设备树仓库地址'
        required: true
        default: 'https://github.com/mmbsmm-git/android_device_youxuepai_k71v1_64_bsp'
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: '设备树路径'
        required: true
        default: 'device/youxuepai/k71v1_64_bsp'
      COMMON_TREE_URL:
        description: '公共设备树仓库地址（无则留空）'
        required: false
        default: ''
      COMMON_PATH:
        description: '公共设备树路径（无则留空）'
        required: false
        default: ''
      DEVICE_NAME:
        description: '设备代号 (Codename)'
        required: true
        default: 'k71v1_64_bsp'
      MAKEFILE_NAME:
        description: 'Makefile 名称 (lunch)'
        required: true
        default: 'omni_k71v1_64_bsp'
      BUILD_TARGET:
        description: '构建目标'
        required: true
        default: 'recovery'

env:
  # Docker repo names must be lowercase. github.repository may contain uppercase
  # (e.g. "Lazy_Action-Recoverys-Builder"), so we lowercase it at runtime in bash.
  IMAGE_TAG: orfrp-9-builder:latest

jobs:
  build:
    name: 编译 OrangeFox Recovery
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write   # needed to push to GHCR
    steps:

    - name: 检出仓库 (Check Out)
      uses: actions/checkout@v4

    - name: 清理环境（保留 Docker）
      uses: rokibhasansagar/slimhub_actions@main
      with:
        # slimhub_actions removes Docker by default; we need it for the container build.
        retain: "docker_buildkit,docker_imgcache"

    - name: 初始化工作目录
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: 设置交换空间 (Swap)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    # Image is pre-built and cached in GHCR. Pull it and reuse directly (deps are
    # installed once, not on every run). Only build + push on first run when GHCR
    # has no image yet. This is the whole point of "cache the built image".
    - name: 拉取现成镜像（不存在才构建并固化一次）
      run: |
        set -e
        # Docker repo names must be lowercase -> lowercase github.repository
        REPO="${{ github.repository }}"
        REPO_LOWER=$(echo "$REPO" | tr 'A-Z' 'a-z')
        IMAGE="ghcr.io/${REPO_LOWER}/${IMAGE_TAG}"
        echo "Using image: $IMAGE"
        echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        export DOCKER_BUILDKIT=1
        # 镜像已固化在 GHCR -> 直接拉取复用，跳过 build（依赖只装一次，不再重装）。
        # 仅当 GHCR 尚无该镜像（首次运行）时才构建并推送一次。
        if docker pull "$IMAGE"; then
          echo "使用 GHCR 现成镜像（依赖已固化，跳过安装）: $IMAGE"
        else
          echo "GHCR 暂无镜像，构建并推送（仅首次，依赖安装一次）..."
          docker build --cache-from "$IMAGE" -t "$IMAGE" -f Dockerfile .
          docker push "$IMAGE"
          echo "镜像已固化到 GHCR: $IMAGE"
        fi

    # Everything (sync + clone + build) happens inside the pre-built 20.04 container.
    - name: 在 20.04 容器内同步/克隆/编译
      run: |
        set -e
        WS="${{ steps.pwd.outputs.workspace-folder }}"
        docker run --rm \
          -v "$WS:/workspace" \
          -e SYNC_URL="${{ github.event.inputs.SYNC_URL }}" \
          -e MANIFEST_BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}" \
          -e DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE_URL }}" \
          -e DEVICE_TREE_BRANCH="${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          -e DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}" \
          -e COMMON_TREE_URL="${{ github.event.inputs.COMMON_TREE_URL }}" \
          -e COMMON_PATH="${{ github.event.inputs.COMMON_PATH }}" \
          -e DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}" \
          -e MAKEFILE_NAME="${{ github.event.inputs.MAKEFILE_NAME }}" \
          -e BUILD_TARGET="${{ github.event.inputs.BUILD_TARGET }}" \
          "$IMAGE" bash -e -c '
            echo "== Running in pre-built container: $(cat /etc/os-release | grep -E "^VERSION_ID") =="
            echo "== python2 + ncurses5 already present =="
            python2 --version
            ldconfig -p | grep -E "lib(tinfo|ncurses)5\\.so" | head

            # --- 1) Sync OrangeFox sources ---
            cd /workspace
            git clone "$SYNC_URL" sync
            cd sync
            chmod 777 orangefox_sync.sh
            ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "/workspace/fox_$MANIFEST_BRANCH"

            # --- 2) Clone device tree ---
            cd "/workspace/fox_$MANIFEST_BRANCH"
            git clone "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" "./$DEVICE_PATH"

            # --- 3) Clone common tree (optional) ---
            if [ -n "$COMMON_TREE_URL" ] && [ -n "$COMMON_PATH" ]; then
              git clone "$COMMON_TREE_URL" -b "$DEVICE_TREE_BRANCH" "./$COMMON_PATH"
            fi

            # --- 3.5) Restrict languages to en + zh_CN only ---
            LANG_DIR=$(find /workspace/fox_$MANIFEST_BRANCH/bootable/recovery -type d -name languages 2>/dev/null | head -1)
            echo "== Restricting OF languages to en + zh_CN (dir: $LANG_DIR) =="
            if [ -z "$LANG_DIR" ]; then
              echo "WARNING: languages dir not found; skipping language restriction"
            else
              ls "$LANG_DIR"
              for f in "$LANG_DIR"/*.xml; do
                [ -e "$f" ] || continue
                base=$(basename "$f")
                if [ "$base" != "en.xml" ] && [ "$base" != "zh_CN.xml" ]; then
                  rm -f "$f"
                fi
              done
              echo "== Remaining languages =="
              ls "$LANG_DIR"
            fi

            # --- 4) Build recovery ---
            cd "/workspace/fox_$MANIFEST_BRANCH"
            source build/envsetup.sh
            export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch "${MAKEFILE_NAME}-eng" && make clean && mka adbd "${BUILD_TARGET}image" -j$(nproc --all)
            echo "=== BUILD FINISHED ==="
            ls -la "/workspace/fox_$MANIFEST_BRANCH/out/target/product/$DEVICE_NAME/" 2>/dev/null || true
          '

    - name: 检查输出目录（上传前）
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

    - name: 上传到 Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
          TREE: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
